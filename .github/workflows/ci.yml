name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci
      - run: npm test
      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.node-version }}
          path: |
            test-results/
            !test-results/**/.gitkeep

  create-issue-on-failure:
    needs: [test]
    if: failure() && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const runId = context.runId;
            const sha = context.sha;
            const ref = context.ref;
            const author = context.actor;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `CI test failure on ${ref} (run #${runId})`,
              body: `## CI Test Failure

              **Run:** [#${runId}](${runUrl})
              **Branch:** ${ref}
              **Commit:** ${sha}
              **Author:** ${author}
              **Event:** ${context.eventName}

              Tests failed on commit ${sha}. Check the [run logs](${runUrl}) for details.`,
              labels: ['ci-failure', 'automated']
            });
