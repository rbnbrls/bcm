name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - name: Cache npm (lint)
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-lint-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-lint-${{ runner.os }}-
      - run: npm ci
      - run: npm run lint

  test:
    # CI #357 test (22) fix: change-processor routing for new_asset_class/new_benchmark (applyChangeLookupRequests),
    # demo fixture HOR-RP vs HORRP code-uniqueness test mismatch — tracked by kanban task t_13e90d09
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - name: Cache npm (test)
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-test-${{ runner.os }}-${{ matrix.node-version }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-test-${{ runner.os }}-${{ matrix.node-version }}-
      - run: npm ci
      - run: npm test
      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.node-version }}
          path: |
            test-results/
            !test-results/**/.gitkeep

  e2e-test:
    # CI #354 failures resolved: portfolio code uniqueness check (same root cause as unit test fix)
    needs: test
    if: always()
    runs-on: ubuntu-latest
    # CI #592: the 15-minute job timeout repeatedly killed this job while the
    # suite was still executing, which masked the failing specs (cancelled
    # jobs skip the playwright summary and report upload). The suite now runs
    # in ~2-3 minutes green; 30 minutes leaves headroom and lets a regression
    # run to completion so its report is uploaded instead of being masked.
    timeout-minutes: 30
    # /admin/* is gated by the bcm_active_role RBAC cookie (proxy.ts +
    # lib/rbac.ts); admin specs set it via helpers.setAdminRole(). No
    # Basic-Auth credentials are needed by the dev server or Playwright.
    env:
      FEEDBACK_DRY_RUN: 1
      # GITHUB_TOKEN is auto-injected by GitHub Actions. Neutralizing it here
      # (defense-in-depth, GH #463) guarantees the dev server can never create
      # a real feedback issue even if the dry-run guard is bypassed — the
      # placeholder-issue spam on the repo came from exactly this leak.
      GITHUB_TOKEN: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - name: Cache npm (e2e)
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-e2e-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-e2e-${{ runner.os }}-
      - run: npm ci
      - name: Cache Playwright browsers
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - name: Install Playwright browsers (drop broken MS azure-cli apt source)
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: |
          # CI #680: packages.microsoft.com/repos/azure-cli intermittently 403s
          # during apt-get update and aborts `playwright install --with-deps`.
          # The azure-cli repo is not needed for browser deps, so remove its
          # source file (deb822 azure-cli.sources ships in the runner image,
          # which the image build only cleans for the legacy .list variant).
          sudo rm -f /etc/apt/sources.list.d/azure-cli.list /etc/apt/sources.list.d/azure-cli.sources
          npx playwright install --with-deps chromium
      # DB-backed specs (tagged @db) run in the e2e-db-test job.
      - run: npm run test:e2e -- --grep-invert "@db"
      - name: Upload playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/

  validate-server-actions:
    # CI #354 failures resolved: RETIRE type added to ChangeActionType union (#368)
    needs: test
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - name: Cache npm (validate)
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-validate-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-validate-${{ runner.os }}-
      - run: npm ci
      - name: Build app with dummy encryption key
        run: npm run build
        env:
          NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${{ secrets.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY || 'ci-dummy-key-for-validation' }}
      - name: Validate server actions
        run: npm run validate:server-actions

  e2e-db-test:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgres://bcm:bcm@localhost:5432/bcm
      # /admin/* specs that run here (client-config-edit, client-config-retire)
      # set the bcm_active_role RBAC cookie via helpers.setAdminRole() — no
      # Basic-Auth credentials are needed (see e2e-test job).
      FEEDBACK_DRY_RUN: 1
      # G2 builder-E2E blijft DB-gebonden en draait expliciet achter de rolloutflags.
      BCM_FEATURE_WORKFLOW_STUDIO_BUILDER: 'true'
      BCM_FEATURE_WORKFLOW_STUDIO_PUBLISH: 'true'
      # See e2e-test job: neutralize the auto-injected token so DB-backed e2e
      # runs can never create real GitHub issues either (GH #463).
      GITHUB_TOKEN: ''
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: bcm
          POSTGRES_PASSWORD: bcm
          POSTGRES_DB: bcm
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - name: Cache npm (e2e-db)
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-e2e-db-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-e2e-db-${{ runner.os }}-
      - run: npm ci
      - name: Cache Playwright browsers
        id: cache-playwright-db
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-db-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-db-${{ runner.os }}-
      - name: Install Playwright browsers (drop broken MS azure-cli apt source)
        if: steps.cache-playwright-db.outputs.cache-hit != 'true'
        run: |
          # CI #680: packages.microsoft.com/repos/azure-cli intermittently 403s
          # during apt-get update and aborts `playwright install --with-deps`.
          # The azure-cli repo is not needed for browser deps, so remove its
          # source file (deb822 azure-cli.sources ships in the runner image,
          # which the image build only cleans for the legacy .list variant).
          sudo rm -f /etc/apt/sources.list.d/azure-cli.list /etc/apt/sources.list.d/azure-cli.sources
          npx playwright install --with-deps chromium
      - name: Apply base schema (db/init.sql)
        run: |
          CID=$(docker ps -q --filter "name=postgres17" | head -1)
          if [ -z "$CID" ]; then echo "postgres service container not found"; docker ps; exit 1; fi
          docker exec -i "$CID" psql -U bcm -d bcm < db/init.sql
      - name: Migrate database
        run: npm run db:migrate
      - name: Seed database
        run: npm run db:seed
      - name: Run migration checks (plan 1.14 migratiechecks, #562)
        run: npx vitest run tests/migration-checks.test.ts
      - name: Seed staged-config e2e data
        run: node tests/e2e/seed-staged-config-e2e.mjs
      - name: Run onboarding staging CRUD integration tests
        run: npx vitest run tests/onboarding-staging-db-integration.test.ts
      - name: Run onboarding apply integration tests
        run: npx vitest run tests/onboarding-apply-integration.test.ts
      - name: Run retire (DELETE) apply integration tests
        run: npx vitest run tests/retire-apply-integration.test.ts
      - name: Run portfolio metadata audit integration tests
        run: npx vitest run tests/portfolio-metadata-audit-integration.test.ts
      - name: Run legacy clients mirror + staging constraint regression (#532)
        run: npx vitest run tests/legacy-clients-mirror-db.test.ts
      - name: Run change_portfolio_configuration long_name boundary regression (#533/#534)
        run: npx vitest run tests/change-portfolio-config-long-name-db.test.ts
      - name: Run DB-backed e2e tests
        run: npx playwright test --grep "@db"
      - name: Upload playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-db
          path: |
            playwright-report/
            test-results/

  deploy-wait-script-test:
    # Unit tests for scripts/wait-for-deployment.sh — the extractable poll
    # logic behind the deploy workflow's wait step (false-green fix, t_8236b90c).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test wait-for-deployment script
        run: bash scripts/tests/wait-for-deployment.test.sh
