name: Deploy to Coolify

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Check out first: the wait step below runs scripts/wait-for-deployment.sh
      # (previously the wait logic was inline, which is how a failed Coolify
      # deployment could exit 0 and turn the whole run green — see t_8236b90c).
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trigger Coolify deployment
        id: trigger
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_APPLICATION_NAME: bcm-development
        run: |
          set -euo pipefail
          echo "Triggering Coolify deployment for ${COOLIFY_APPLICATION_NAME}..."
          APPLICATIONS=$(curl -sS --fail-with-body "https://dev.7rb.nl/api/v1/applications" \
            -H "Authorization: Bearer ${COOLIFY_API_TOKEN}")
          if ! APP_UUID=$(printf '%s' "${APPLICATIONS}" | python3 -c 'import json,os,sys; target=os.environ["COOLIFY_APPLICATION_NAME"]; applications=json.load(sys.stdin); matches=[app for app in applications if app.get("name") == target]; assert len(matches) == 1, f"expected exactly one Coolify application named {target}, found {len(matches)}"; uuid=matches[0].get("uuid"); assert uuid, f"Coolify application {target} has no UUID"; print(uuid)')
          then
            echo "::error::Could not resolve the exact Coolify application name ${COOLIFY_APPLICATION_NAME}."
            exit 1
          fi
          echo "Resolved Coolify application ${COOLIFY_APPLICATION_NAME}."
          RESPONSE=$(curl -sS --fail-with-body -X POST "https://dev.7rb.nl/api/v1/deploy" \
            -H "Authorization: Bearer ${COOLIFY_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"uuid\": \"${APP_UUID}\", \"force\": false}")
          echo "Response: ${RESPONSE}"
          if ! DEPLOY_UUID=$(printf '%s' "${RESPONSE}" | python3 -c 'import json,sys; response=json.load(sys.stdin); deployments=response.get("deployments"); assert isinstance(deployments,list) and deployments and deployments[0].get("deployment_uuid"), "Coolify response did not include a deployment UUID"; print(deployments[0]["deployment_uuid"])')
          then
            echo "::error::Coolify trigger response did not include a deployment UUID. Check the COOLIFY_API_TOKEN Actions secret and the target application."
            exit 1
          fi
          echo "deployment_uuid=${DEPLOY_UUID}" >> $GITHUB_OUTPUT

      # Exits non-zero on failed/error/cancelled/timed_out/untrackable so a
      # failing Coolify deployment fails the job instead of going green with
      # the smoke test silently skipped (CI run #294 false-green).
      - name: Wait for deployment to finish
        id: wait
        timeout-minutes: 15
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          DEPLOY_UUID: ${{ steps.trigger.outputs.deployment_uuid }}
        run: ./scripts/wait-for-deployment.sh

      - name: Setup Node
        if: steps.wait.outputs.status == 'success'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        if: steps.wait.outputs.status == 'success'
        run: npm ci

      - name: Cache Playwright browsers
        if: steps.wait.outputs.status == 'success'
        id: cache-playwright-smoke
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-smoke-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-smoke-${{ runner.os }}-

      - if: steps.wait.outputs.status == 'success' && steps.cache-playwright-smoke.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Run server-action smoke test against production
        if: steps.wait.outputs.status == 'success'
        # /admin/* is gated by the identity-session RBAC (proxy.ts +
        # lib/identity/request.ts): the page only renders when the request
        # carries a bcm_identity_session cookie signed with the production
        # BCM_SESSION_SECRET and holding the admin group. The smoke spec sets
        # that cookie itself (server-action-smoke.spec.ts beforeEach via
        # tests/e2e/identity-session.ts) and navigates to TARGET_URL, so no
        # HTTP Basic Auth credentials are required.
        #
        # BCM_SESSION_SECRET must be the SAME random value configured in the
        # Coolify application env (set during ops; see audit t_f0ced50a). The
        # committed e2e fallback value is rejected by lib/identity/session.ts
        # in production, so the smoke test fails loudly if this secret is
        # missing instead of silently testing an anonymous session.
        env:
          TARGET_URL: "https://bcm.7rb.nl"
          BCM_SESSION_SECRET: ${{ secrets.BCM_SESSION_SECRET }}
        run: npm run smoke:server-actions
