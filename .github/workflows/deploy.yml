name: Deploy to Coolify

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Check out first: the wait step below runs scripts/wait-for-deployment.sh
      # (previously the wait logic was inline, which is how a failed Coolify
      # deployment could exit 0 and turn the whole run green — see t_8236b90c).
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trigger Coolify deployment
        id: trigger
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          echo "Triggering Coolify deployment for bcm..."
          RESPONSE=$(curl -s -X POST "https://dev.7rb.nl/api/v1/deploy" \
            -H "Authorization: Bearer ${COOLIFY_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"uuid": "fl27k4hn1oh2dqgwd05ukox8", "force": false}')
          echo "Response: ${RESPONSE}"
          DEPLOY_UUID=$(echo "${RESPONSE}" | python3 -c "import sys,json; print(json.load(sys.stdin).get('deployments',[{}])[0].get('deployment_uuid','unknown'))" 2>/dev/null || echo "unknown")
          # Fail fast when the trigger produced no deployment UUID. Run #387
          # (issue #621) died here with a 401 {"message":"Unauthenticated."}
          # from a stale/revoked COOLIFY_API_TOKEN secret, which only surfaced
          # later as the cryptic "No deployment UUID available" in the wait
          # step. Report the auth failure directly so the fix is an obvious
          # one-line secret rotation instead of a log-digging exercise.
          if [ "${DEPLOY_UUID}" = "unknown" ]; then
            RESPONSE_LC=$(printf '%s' "${RESPONSE}" | tr 'A-Z' 'a-z')
            case "${RESPONSE_LC}" in
              *unauthenticated*|*401*|*unauthorized*|*"invalid token"*)
                echo "::error::Coolify API rejected the trigger request: ${RESPONSE}. The COOLIFY_API_TOKEN Actions secret is stale or revoked — rotate it under Settings → Secrets and variables → Actions and re-run this workflow (issue #621)."
                ;;
              *)
                echo "::error::Could not parse a deployment UUID from the Coolify trigger response: ${RESPONSE}"
                ;;
            esac
            exit 1
          fi
          echo "deployment_uuid=${DEPLOY_UUID}" >> $GITHUB_OUTPUT

      # Exits non-zero on failed/error/cancelled/timed_out/untrackable so a
      # failing Coolify deployment fails the job instead of going green with
      # the smoke test silently skipped (CI run #294 false-green).
      - name: Wait for deployment to finish
        id: wait
        timeout-minutes: 15
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          DEPLOY_UUID: ${{ steps.trigger.outputs.deployment_uuid }}
        run: ./scripts/wait-for-deployment.sh

      - name: Setup Node
        if: steps.wait.outputs.status == 'success'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        if: steps.wait.outputs.status == 'success'
        run: npm ci

      - name: Cache Playwright browsers
        if: steps.wait.outputs.status == 'success'
        id: cache-playwright-smoke
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-smoke-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-smoke-${{ runner.os }}-

      - if: steps.wait.outputs.status == 'success' && steps.cache-playwright-smoke.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Run server-action smoke test against production
        if: steps.wait.outputs.status == 'success'
        # /admin/* is gated by the identity-session RBAC (proxy.ts +
        # lib/identity/request.ts): the page only renders when the request
        # carries a bcm_identity_session cookie signed with the production
        # BCM_SESSION_SECRET and holding the admin group. The smoke spec sets
        # that cookie itself (server-action-smoke.spec.ts beforeEach via
        # tests/e2e/identity-session.ts) and navigates to TARGET_URL, so no
        # HTTP Basic Auth credentials are required.
        #
        # BCM_SESSION_SECRET must be the SAME random value configured in the
        # Coolify application env (set during ops; see audit t_f0ced50a). The
        # committed e2e fallback value is rejected by lib/identity/session.ts
        # in production, so the smoke test fails loudly if this secret is
        # missing instead of silently testing an anonymous session.
        env:
          TARGET_URL: "https://bcm.7rb.nl"
          BCM_SESSION_SECRET: ${{ secrets.BCM_SESSION_SECRET }}
        run: npm run smoke:server-actions
