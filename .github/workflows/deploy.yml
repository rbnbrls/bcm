name: Deploy to Coolify

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify deployment
        id: trigger
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_APPLICATION_NAME: bcm-test
        run: |
          set -euo pipefail
          echo "Triggering Coolify deployment for bcm..."
          APPLICATIONS=$(curl -sS --fail-with-body "https://dev.7rb.nl/api/v1/applications" \
            -H "Authorization: Bearer ${COOLIFY_API_TOKEN}")
          if ! APP_UUID=$(printf '%s' "${APPLICATIONS}" | python3 -c 'import json,os,sys; target=os.environ["COOLIFY_APPLICATION_NAME"]; applications=json.load(sys.stdin); matches=[app for app in applications if app.get("name") == target]; assert len(matches) == 1, f"expected exactly one Coolify application named {target}, found {len(matches)}"; uuid=matches[0].get("uuid"); assert uuid, f"Coolify application {target} has no UUID"; print(uuid)')
          then
            echo "::error::Could not resolve the exact Coolify application name ${COOLIFY_APPLICATION_NAME}."
            exit 1
          fi
          echo "Resolved Coolify application ${COOLIFY_APPLICATION_NAME}."
          RESPONSE=$(curl -sS --fail-with-body -X POST "https://dev.7rb.nl/api/v1/deploy" \
            -H "Authorization: Bearer ${COOL...KEN}" \
            -H "Content-Type: application/json" \
            -d "{\"uuid\": \"${APP_UUID}\", \"force\": false}")
          echo "Response: ${RESPONSE}"
          DEPLOY_UUID=$(printf '%s' "${RESPONSE}" | python3 -c 'import json,sys; response=json.load(sys.stdin); deployments=response.get("deployments"); assert isinstance(deployments,list) and deployments and deployments[0].get("deployment_uuid"), "Coolify response did not include a deployment UUID"; print(deployments[0]["deployment_uuid"])')
          echo "deployment_uuid=${DEPLOY_UUID}" >> $GITHUB_OUTPUT

      - name: Wait for deployment to finish
        id: wait
        timeout-minutes: 15
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          DEPLOY_UUID: ${{ steps.trigger.outputs.deployment_uuid }}
        run: |
          set -euo pipefail
          echo "Waiting for deployment ${DEPLOY_UUID}..."
          for i in $(seq 1 30); do
            STATUS=$(curl -sS --fail-with-body "https://dev.7rb.nl/api/v1/deployments/${DEPLOY_UUID}" \
              -H "Authorization: Bearer ${COOL...KEN}" \
              | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('status','unknown'))" 2>/dev/null)
            echo "  [${i}/30] Status: ${STATUS}"
            case "${STATUS}" in
              finished|success)
                echo "Deployment finished successfully."
                echo "status=success" >> $GITHUB_OUTPUT
                exit 0
                ;;
              failed|error|cancelled)
                echo "::error::Deployment ${STATUS}."
                echo "status=${STATUS}" >> $GITHUB_OUTPUT
                exit 1
                ;;
              *)
                sleep 30
                ;;
            esac
          done
          echo "::error::Deployment did not finish within timeout."
          echo "status=timed_out" >> $GITHUB_OUTPUT
          exit 1

      - name: Checkout
        if: steps.wait.outputs.status == 'success'
        uses: actions/checkout@v4

      - name: Setup Node
        if: steps.wait.outputs.status == 'success'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        if: steps.wait.outputs.status == 'success'
        run: npm ci

      - name: Cache Playwright browsers
        if: steps.wait.outputs.status == 'success'
        id: cache-playwright-smoke
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-smoke-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-smoke-${{ runner.os }}-

      - if: steps.wait.outputs.status == 'success' && steps.cache-playwright-smoke.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Run server-action smoke test against production
        if: steps.wait.outputs.status == 'success'
        env:
          TARGET_URL: "https://bcm.7rb.nl"
        run: npm run smoke:server-actions