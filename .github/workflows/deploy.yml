name: Deploy to Coolify

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify deployment
        id: trigger
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          echo "Triggering Coolify deployment for bcm..."
          RESPONSE=$(curl -s -X POST "https://dev.7rb.nl/api/v1/deploy" \
            -H "Authorization: Bearer ${COOLIFY_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"uuid": "fl27k4hn1oh2dqgwd05ukox8", "force": false}')
          echo "Response: ${RESPONSE}"
          DEPLOY_UUID=$(echo "${RESPONSE}" | python3 -c "import sys,json; print(json.load(sys.stdin).get('deployments',[{}])[0].get('deployment_uuid','unknown'))" 2>/dev/null || echo "unknown")
          echo "deployment_uuid=${DEPLOY_UUID}" >> $GITHUB_OUTPUT

      - name: Wait for deployment to finish
        id: wait
        timeout-minutes: 15
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          DEPLOY_UUID: ${{ steps.trigger.outputs.deployment_uuid }}
        run: |
          if [ "${DEPLOY_UUID}" = "unknown" ]; then
            echo "No deploy UUID returned — skipping wait for deployment status."
            echo "status=unknown" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "Waiting for deployment ${DEPLOY_UUID}..."
          for i in $(seq 1 30); do
            STATUS=$(curl -s "https://dev.7rb.nl/api/v1/deployments/${DEPLOY_UUID}" \
              -H "Authorization: Bearer ${COOLIFY_API_TOKEN}" \
              | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('status','unknown'))" 2>/dev/null)
            echo "  [${i}/30] Status: ${STATUS}"
            case "${STATUS}" in
              finished|success)
                echo "Deployment finished successfully."
                echo "status=success" >> $GITHUB_OUTPUT
                exit 0
                ;;
              failed|error|cancelled)
                echo "Deployment ${STATUS}."
                echo "status=${STATUS}" >> $GITHUB_OUTPUT
                exit 0
                ;;
              *)
                sleep 30
                ;;
            esac
          done
          echo "Deployment did not finish within timeout."
          echo "status=timed_out" >> $GITHUB_OUTPUT

      - name: Checkout
        if: steps.wait.outputs.status == 'success'
        uses: actions/checkout@v4

      - name: Setup Node
        if: steps.wait.outputs.status == 'success'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        if: steps.wait.outputs.status == 'success'
        run: npm ci

      - name: Cache Playwright browsers
        if: steps.wait.outputs.status == 'success'
        id: cache-playwright-smoke
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-smoke-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-smoke-${{ runner.os }}-

      - if: steps.wait.outputs.status == 'success' && steps.cache-playwright-smoke.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Run server-action smoke test against production
        if: steps.wait.outputs.status == 'success'
        env:
          TARGET_URL: "https://bcm.7rb.nl"
          # /admin/* is gated by HTTP Basic Auth (proxy.ts). Playwright's
          # httpCredentials (playwright.config.ts) must match the production
          # ADMIN_USER/ADMIN_PASSWORD set in Coolify, so pass them through
          # from the repo secrets.
          ADMIN_USER: ${{ secrets.ADMIN_USER }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: npm run smoke:server-actions