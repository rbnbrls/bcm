services:
  backup:
    image: postgres:17-alpine
    environment:
      DATABASE_URL: postgres://bcm:${POSTGRES_PASSWORD:-change-me}@db:5432/bcm
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: 7
    volumes:
      - bcm_postgres_backups:/backups
      - ./scripts/backup.mjs:/usr/local/bin/backup.mjs:ro
    command: >
      sh -c "
        apk add --no-cache nodejs &&
        echo '0 3 * * * node /usr/local/bin/backup.mjs >> /var/log/backup.log 2>&1' | crontab - &&
        crond -f -l 2
      "
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://bcm:${POSTGRES_PASSWORD:-change-me}@db:5432/bcm
      HOSTNAME: 0.0.0.0
    networks:
      - coolify
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.bcm-https.entryPoints=https"
      - "traefik.http.routers.bcm-https.rule=Host(`bcm.7rb.nl`) && PathPrefix(`/`)"
      - "traefik.http.routers.bcm-https.tls=true"
      - "traefik.http.routers.bcm-https.tls.certresolver=letsencrypt"
      - "traefik.http.routers.bcm-https.service=bcm-app"
      - "traefik.http.routers.bcm-http.entryPoints=http"
      - "traefik.http.routers.bcm-http.rule=Host(`bcm.7rb.nl`) && PathPrefix(`/`)"
      - "traefik.http.routers.bcm-http.middlewares=redirect-to-https"
      - "traefik.http.routers.bcm-http.service=bcm-app"
      - "traefik.http.services.bcm-app.loadbalancer.server.port=3000"

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bcm
      POSTGRES_USER: bcm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bcm -d bcm"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - bcm_postgres:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    networks:
      - internal

networks:
  coolify:
    external: true
    name: coolify
  internal:

volumes:
  bcm_postgres:
  bcm_postgres_backups:
