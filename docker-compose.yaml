services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      HOSTNAME: 0.0.0.0
    networks:
      - coolify
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.bcm-https.entryPoints=https"
      - "traefik.http.routers.bcm-https.rule=Host(`bcm.7rb.nl`) && PathPrefix(`/`)"
      - "traefik.http.routers.bcm-https.tls=true"
      - "traefik.http.routers.bcm-https.tls.certresolver=letsencrypt"
      - "traefik.http.routers.bcm-https.service=bcm-app"
      - "traefik.http.routers.bcm-http.entryPoints=http"
      - "traefik.http.routers.bcm-http.rule=Host(`bcm.7rb.nl`) && PathPrefix(`/`)"
      - "traefik.http.routers.bcm-http.middlewares=redirect-to-https"
      - "traefik.http.routers.bcm-http.service=bcm-app"
      - "traefik.http.services.bcm-app.loadbalancer.server.port=3000"

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bcm
      POSTGRES_USER: bcm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bcm -d bcm"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - bcm_postgres:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    networks:
      - internal

networks:
  coolify:
    external: true
    name: coolify
  internal:

volumes:
  bcm_postgres:
