# Local development configuration (default).
# A Coolify variant with Traefik labels is available as docker-compose.coolify.yaml
# (use `docker compose -f docker-compose.coolify.yaml up`).
services:
  backup:
    image: postgres:17-alpine
    environment:
      DATABASE_URL: postgres://bcm:${POSTGRES_PASSWORD:-change-me}@db:5432/bcm
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: 7
    volumes:
      - bcm_postgres_backups:/backups
      - ./scripts/backup.mjs:/usr/local/bin/backup.mjs:ro
    command: >
      sh -c "
        apk add --no-cache nodejs &&
        echo '0 3 * * * node /usr/local/bin/backup.mjs >> /var/log/backup.log 2>&1' | crontab - &&
        crond -f -l 2
      "
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://bcm:***@db:5432/bcm
      HOSTNAME: 0.0.0.0
      # Workflow Studio feature flags. Defaults mirror docker-compose.coolify.yaml
      # so the Studio is on for every deployment path unless explicitly disabled.
      # The application itself fails closed: without a value the flag is off.
      BCM_FEATURE_WORKFLOW_STUDIO_BUILDER: ${BCM_FEATURE_WORKFLOW_STUDIO_BUILDER:-true}
      BCM_FEATURE_WORKFLOW_STUDIO_PUBLISH: ${BCM_FEATURE_WORKFLOW_STUDIO_PUBLISH:-true}
      BCM_FEATURE_WORKFLOW_RUNTIME_START: ${BCM_FEATURE_WORKFLOW_RUNTIME_START:-false}
      BCM_FEATURE_WORKFLOW_RUNTIME_SHADOW_COMPARE: ${BCM_FEATURE_WORKFLOW_RUNTIME_SHADOW_COMPARE:-false}
      # Identity sessions gate /workflow-studio* (proxy.ts authorizeWorkflowStudioRoute
      # requires workflow:view). Without an issued identity every user is anonymous
      # and the Studio redirects to /. Defaults mirror docker-compose.coolify.yaml so
      # the switcher issues a change_manager identity (workflow:view + design/test/
      # publish) out of the box. BCM_SESSION_SECRET is required in production-mode
      # containers (NODE_ENV=production is pinned in the Dockerfile).
      BCM_ENABLE_IDENTITY_SWITCHER: ${BCM_ENABLE_IDENTITY_SWITCHER:-true}
      BCM_DISABLE_IDENTITY_SWITCHER: ${BCM_DISABLE_IDENTITY_SWITCHER:-false}
      BCM_IDENTITY_USER_ID: ${BCM_IDENTITY_USER_ID:-uat:change_manager}
      BCM_IDENTITY_DISPLAY_NAME: ${BCM_IDENTITY_DISPLAY_NAME:-Chris Change}
      BCM_IDENTITY_GROUPS: ${BCM_IDENTITY_GROUPS:-bcm:role:change_manager}
      BCM_IDENTITY_TENANT: ${BCM_IDENTITY_TENANT:-uat}
      BCM_IDENTITY_BUSINESS_UNIT: ${BCM_IDENTITY_BUSINESS_UNIT:-uat}
      BCM_SESSION_SECRET: ${BCM_SESSION_SECRET}
    ports:
      - "3000:3000"

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bcm
      POSTGRES_USER: bcm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bcm -d bcm"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - bcm_postgres:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro

volumes:
  bcm_postgres:
  bcm_postgres_backups:
